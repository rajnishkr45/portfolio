<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #1c2541;
            min-height: 100vh;
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Page Containers --- */
        .page-container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #intro-page {
            z-index: 10;
        }

        #gallery-page {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 5;
            justify-content: flex-start;
            padding-top: 40px;
            padding-bottom: 60px;
        }

        /* --- Typography & Headings --- */
        .title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 107, 107, 0.7), 0 0 30px rgba(255, 142, 83, 0.5);
            animation: fadeInDown 1.5s ease-out forwards, pulseGlow 3s infinite alternate;
        }

        .name-highlight {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb);
            -webkit-background-clip: text;
            margin-top: 15px;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            font-size: clamp(1rem, 3.5vw, 1.35rem);
            font-weight: 300;
            margin-top: 18px;
            max-width: 600px;
            line-height: 1.6;
            color: #e0e6ed;
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 0.8s forwards;
        }

        .gallery-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
        }

        .gallery-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        /* --- Action Buttons --- */
        .btn-group {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 320px;
            z-index: 20;
        }

        .btn {
            width: 100%;
            padding: 16px 28px;
            font-size: clamp(1rem, 3vw, 1.15rem);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #wishBtn {
            opacity: 0;
            animation: fadeInUp 1.5s ease-out 1.5s forwards;
        }

        #nextBtn {
            display: none;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* --- Floating Audio Controller --- */
        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .music-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        /* --- Responsive Photo Gallery Grid --- */
        .gallery-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 10px;
            margin-bottom: 40px;
        }

        .gallery-card {
            position: relative;
            aspect-ratio: 12 / 16;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.35);
        }

        .gallery-card:hover img {
            transform: scale(1.08);
        }

        /* --- Background Floating Balloons --- */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: clamp(30px, 6vw, 45px);
            height: clamp(40px, 8vw, 60px);
            border-radius: 50%;
            opacity: 0.75;
            animation: floatUp linear infinite;
        }

        .balloon::before {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid inherit;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* --- Confetti Elements --- */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 50;
            pointer-events: none;
        }

        /* --- Keyframe Animations --- */
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-40px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.02);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes explode {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* --- Responsive Tweaks for Small Screens --- */
        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 6px;
            }

            .btn-group {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Balloons Background -->
    <div class="balloon-container" id="balloons"></div>

    <!-- Music Toggle Button (appears on Gallery page) -->
    <button class="music-toggle" id="musicToggle" onclick="toggleMusic()" style="display: none;"
        title="Toggle Music">🎵</button>

    <!-- Background Audio -->
    <audio id="bgMusic" loop preload="auto">
        <!-- REPLACE 'birthday-song.mp3' with your audio file name or URL -->
        <source src="bday_song.mp3" type="audio/mpeg">
    </audio>

    <!-- PAGE 1: Birthday Wish & Name Greeting -->
    <section id="intro-page" class="page-container">
        <h1 class="title">Happy Birthday, <br><span class="name-highlight" id="userName">Ruchi &nbsp;</span> ! 🎉</h1>
        <p class="subtitle">Wishing you a year ahead filled with happiness, great health, and unforgettable moments.</p>

        <div class="btn-group">
            <button id="wishBtn" class="btn" onclick="celebrate()">Make a Wish ✨</button>
            <button id="nextBtn" class="btn" onclick="openPresent()">See Your Gifts 🎁</button>
        </div>
    </section>

    <!-- PAGE 2: Responsive Photo Gallery & Music -->
    <section id="gallery-page" class="page-container">
        <h2 class="gallery-title">Cherished Memories</h2>
        <p class="gallery-subtitle">A collection of moments worth celebrating ✨</p>

        <div class="gallery-container">
            <!-- Replace these links with your own photos (e.g., photo1.jpg, photo2.png) -->
            <div class="gallery-card"><img src="1.jpg" alt="Photo 1"></div>
            <div class="gallery-card"><img src="2.jpg" alt="Photo 2"></div>
            <div class="gallery-card"><img src="3.jpg" alt="Photo 3"></div>
            <div class="gallery-card"><img src="4.jpg" alt="Photo 4"></div>
            <div class="gallery-card"><img src="5.jpg" alt="Photo 5"></div>
            <div class="gallery-card"><img src="6.jpg" alt="Photo 6"></div>
            </div>
    </section>

    <script>
        const colors = ['#ff6b6b', '#ff8e53', '#4facfe', '#00f2fe', '#f2d74e', '#a18cd1', '#fbc2eb'];

        // 1. Dynamic Name Resolver
        // Checks if a name is provided in the URL query string: ?name=YourName
        function loadName() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');
            if (nameParam) {
                document.getElementById('userName').textContent = nameParam;
            }
        }

        // 2. Generate Random Floating Balloons
        function createBalloons() {
            const container = document.getElementById('balloons');
            const count = window.innerWidth < 480 ? 12 : 20;

            for (let i = 0; i < count; i++) {
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');

                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = Math.random() * 95 + 'vw';
                balloon.style.backgroundColor = randomColor;
                balloon.style.borderBottomColor = randomColor;
                balloon.style.animationDuration = (Math.random() * 4 + 6) + 's';
                balloon.style.animationDelay = (Math.random() * 6) + 's';

                container.appendChild(balloon);
            }
        }

        // 3. Confetti Animation Trigger
        function celebrate() {
            const count = window.innerWidth < 480 ? 60 : 120;

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const duration = Math.random() * 2.5 + 2;
                confetti.style.animation = `explode ${duration}s ease-in forwards`;
                confetti.style.animationDelay = Math.random() * 0.4 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), (duration + 0.5) * 1000);
            }

            const wishBtn = document.getElementById('wishBtn');
            wishBtn.innerText = "Wish Granted! 🥳";
            wishBtn.style.pointerEvents = "none";

            // Reveal the next action button smoothly
            setTimeout(() => {
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.style.display = "block";
                nextBtn.style.animation = "fadeInUp 0.8s ease-out forwards";
            }, 1200);
        }

        // 4. Transition to Photo Gallery & Play Music
        function openPresent() {
            const introPage = document.getElementById('intro-page');
            const galleryPage = document.getElementById('gallery-page');
            const musicToggle = document.getElementById('musicToggle');
            const music = document.getElementById('bgMusic');

            introPage.style.opacity = '0';
            introPage.style.transform = 'translateY(-20px)';
            introPage.style.pointerEvents = 'none';

            setTimeout(() => {
                introPage.style.display = 'none';
                galleryPage.style.visibility = 'visible';
                galleryPage.style.pointerEvents = 'auto';
                galleryPage.style.opacity = '1';
                musicToggle.style.display = 'flex';

                // Play song
                music.play().catch(err => console.log('Audio autoplay prevented:', err));
            }, 800);
        }

        // 5. Audio Play / Pause Toggle
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const toggleBtn = document.getElementById('musicToggle');

            if (music.paused) {
                music.play();
                toggleBtn.innerText = '🎵';
            } else {
                music.pause();
                toggleBtn.innerText = '🔇';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadName();
            createBalloons();
        });
    </script>
</body>

</html>
